plugins { id 'com.android.application' }

android {
    namespace 'jp.tenreader.launcher'
    compileSdk 36
    defaultConfig {
        applicationId 'jp.tenreader.launcher'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv('TEN_DEBUG_KEYSTORE') ?: "${rootProject.projectDir}/../.ten-cache/keys/ten-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
