<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ten. をスマホで試す</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/share.css"></head><body><main class="share-page"><a class="brand" href="/">ten<span>.</span></a><h1>スマホで、試してみる。</h1><p>AndroidのカメラでQRを読み取って、ブラウザでtenを開けます。</p><form id="share-form"><label for="share-url">公開したtenのURL</label><input id="share-url" type="url" required placeholder="https://…"><button class="primary">QRを表示する</button></form><p id="share-message" role="status">スマホから開ける公開URLが必要です。</p><section id="qr-result" hidden><img id="qr-image" alt="ブラウザ試用版を開くQRコード" width="320" height="320"><a id="trial-link" target="_blank" rel="noopener noreferrer"></a><a id="save-qr" download="ten-qr.png">QR画像を保存</a></section><ol><li>スマホのカメラでQRを読み取る</li><li>スクリーンショットを選ぶ</li><li>文字を読み取り、速読を開始</li></ol><p class="hint">インストール不要。画像をサーバーへ送信しません。初回はOCRデータを読み込みます。Androidの共有先への登録や他アプリの自動スクロールは、このブラウザ版にはありません。</p></main><script type="module" src="/share.bundle.js"></script></body></html>
